# pnpm 10 no longer reads the `pnpm` field from package.json, so these settings
# must live here. See https://pnpm.io/settings
#
# The published @deepseek-ai/dsh-client-* packages omit dependencies that their
# own lib/*.js and lib/*.d.ts import, because they are built inside the dsh
# monorepo. packageExtensions backfills them so `pnpm check` can resolve the
# inlined primitives package in vitest (the published plugin never bundles
# these: they stay external at runtime and are provided by dsh itself).
packageExtensions:
  '@deepseek-ai/dsh-client-ui-primitives@0.2.0-rc.2':
    dependencies:
      '@deepseek-ai/dsh-client-store': 0.2.0-rc.2
      '@deepseek-ai/dsh-util-code-language': 0.2.0-rc.2
      '@deepseek-ai/dsh-util-workspace-path': 0.2.0-rc.2
      anser: ^2.3.5
      clsx: ^2.1.1
      diff: ^9.0.0
      mdast-util-from-markdown: ^2.0.2
      mdast-util-gfm: ^3.1.0
      mdast-util-math: ^3.0.0
      micromark-core-commonmark: ^2.0.3
      micromark-extension-gfm: ^3.0.0
      micromark-extension-math: ^3.1.0
      micromark-factory-space: ^2.0.1
      micromark-util-character: ^2.1.1
      micromark-util-classify-character: ^2.0.1
      micromark-util-sanitize-uri: ^2.0.1
      micromark-util-symbol: ^2.0.1
      micromark-util-types: ^2.0.2
      simple-icons: ^16.33.0
  '@deepseek-ai/dsh-client-store@0.2.0-rc.2':
    dependencies:
      immer: ^10.1.1
      zustand: ^5.0.8
